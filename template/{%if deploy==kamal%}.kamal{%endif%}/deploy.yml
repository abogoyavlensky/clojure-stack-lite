<% require "dotenv"; Dotenv.load(".env") %>

service: {{ project-name }}
image: <%= ENV['REGISTRY_USERNAME'] %>/{{ project-name }}
servers:
  - <%= ENV['SERVER_IP'] %>

proxy:
  ssl: true
  host: <%= ENV['APP_DOMAIN'] %>
  healthcheck:
    path: /health

registry:
  server: ghcr.io
  username:
    - REGISTRY_USERNAME
  password:
    - REGISTRY_PASSWORD

builder:
  arch: amd64
  remote: ssh://root@<%= ENV['SERVER_IP'] %>
  cache:
    type: gha

env:
  secret:
    - SESSION_SECRET_KEY
{% case db %}{% when sqlite %}
volumes:
  - "/root/{{ project-name }}-db:/app/db"{% when postgres %}    - DATABASE_URL

# Database
accessories:
  db:
    image: postgres:17.4-alpine3.21
    host: <%= ENV['SERVER_IP'] %>
    env:
      secret:
        - POSTGRES_DB
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    directories:
      - {{ project-name | snake_case }}_postgres_data:/var/lib/postgresql/data{% endcase %}
